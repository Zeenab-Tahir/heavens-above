name-template: "Release v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "Features"
    labels:
      - feature
  - title: "Fixes"
    labels:
      - bug
  - title: "Maintenance"
    labels:
      - chore
change-template: "- $TITLE @$AUTHOR"
template: |
  ## Changes
  $CHANGES
