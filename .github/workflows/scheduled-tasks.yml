name: Scheduled Scrape (daily)

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (adjust)
  workflow_dispatch:    # allow manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install
        run: npm ci
      - name: Run scraper
        run: node run.js
      - name: Upload scraped data (public/data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data-${{ github.run_id }}
          path: public/data || public\data
